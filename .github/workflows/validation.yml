name: Source validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
      - run: npm ci
      - run: uv sync --locked
      - run: npx tsx --test script/*.test.ts
      - run: uv run python -m unittest discover -s script -p 'test_*.py'
      - run: npm run check
      - run: npm run build
